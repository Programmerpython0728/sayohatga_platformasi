services:
  db:
    image: postgres:16-alpine
    container_name: sayohatga_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-sayohatga}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-sayohatga}"]
      interval: 10s
      timeout: 5s
      retries: 10

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sayohatga_web
    restart: unless-stopped
    command: gunicorn sayohatga.wsgi:application --bind 0.0.0.0:8000 --workers 3 --timeout 120
    env_file:
      - .env
    environment:
      DEBUG: "False"
      DB_ENGINE: postgres
      DB_HOST: db
      DB_PORT: 5432
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/media

  bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sayohatga_bot
    restart: unless-stopped
    command: python manage.py run_telegram_bot
    env_file:
      - .env
    environment:
      DEBUG: "False"
      DB_ENGINE: postgres
      DB_HOST: db
      DB_PORT: 5432
    depends_on:
      db:
        condition: service_healthy

  nginx:
    image: nginx:1.27-alpine
    container_name: sayohatga_nginx
    restart: unless-stopped
    depends_on:
      - web
    ports:
      - "8000:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - static_volume:/app/staticfiles:ro
      - media_volume:/app/media:ro

volumes:
  postgres_data:
  static_volume:
  media_volume:
